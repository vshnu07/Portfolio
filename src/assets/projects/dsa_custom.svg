<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="#1d1836" />
  <rect x="30" y="30" width="140" height="140" rx="35" stroke="url(#grad1)" stroke-width="4" opacity="0.6" />
  
  <!-- DSA Symbolism: Nodes and Connections -->
  <!-- Connection Lines -->
  <line x1="70" y1="70" x2="130" y2="70" stroke="url(#grad1)" stroke-width="3" />
  <line x1="130" y1="70" x2="100" y2="130" stroke="url(#grad1)" stroke-width="3" />
  <line x1="100" y1="130" x2="70" y2="70" stroke="url(#grad1)" stroke-width="3" />
  <line x1="100" y1="130" x2="100" y2="60" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 2" />
  
  <!-- Nodes -->
  <circle cx="70" cy="70" r="10" fill="url(#grad1)" filter="url(#shadow)" />
  <circle cx="130" cy="70" r="10" fill="url(#grad1)" filter="url(#shadow)" />
  <circle cx="100" cy="130" r="12" fill="#00f2fe" filter="url(#shadow)" />
  
  <!-- "DSA" Text -->
  <text x="100" y="165" fill="#00f2fe" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">DSA</text>
</svg>
